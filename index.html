<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arriving Soon...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2c3e50, #3498db);
      color: white;
      text-align: center;
    }

    img.logo {
      max-width: 180px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 3em;
      margin: 0;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 1.2em;
      margin-top: 10px;
      opacity: 0.8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9em;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <!-- Brand Logo -->
  <img src="your-logo.png" alt="Brand Logo" class="logo">

  <!-- Coming Soon Message -->
  <h1>Arriving Soon...</h1>
  <p>We’re working hard to bring something amazing for you.</p>

  <!-- Footer -->
  <footer>© 2025 Your Brand Name</footer>
</body>
</html>
